global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'api-gateway'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['api-gateway:8080']

  - job_name: 'item-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['item-service:8081']

  - job_name: 'auth-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['auth-service:8081']

  - job_name: 'ocorrencia-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['ocorrencia-service:8082']
