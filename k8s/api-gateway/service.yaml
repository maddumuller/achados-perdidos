apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: achados-perdidos
  labels:
    app: api-gateway
spec:
  selector:
    app: api-gateway
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-metrics
  namespace: achados-perdidos
spec:
  clusterIP: None
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
