apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: achados-perdidos-ingress
  namespace: achados-perdidos
spec:
  ingressClassName: achados-traefik
  rules:
    - host: achados-perdidos.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
