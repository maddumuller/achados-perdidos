apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: achados-traefik
spec:
  controller: traefik.io/ingress-controller
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: traefik
  namespace: achados-perdidos
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: traefik
  namespace: achados-perdidos
rules:
  - apiGroups: [""]
    resources: ["services", "secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: traefik
  namespace: achados-perdidos
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: traefik
subjects:
  - kind: ServiceAccount
    name: traefik
    namespace: achados-perdidos
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: achados-tp3-ingress
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingressclasses"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: achados-tp3-ingress
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: achados-tp3-ingress
subjects:
  - kind: ServiceAccount
    name: traefik
    namespace: achados-perdidos
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik
  namespace: achados-perdidos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: traefik
  template:
    metadata:
      labels:
        app: traefik
    spec:
      serviceAccountName: traefik
      containers:
        - name: traefik
          image: traefik:v3.6.12
          args:
            - --entrypoints.web.address=:8000
            - --providers.kubernetesingress
            - --providers.kubernetesingress.namespaces=achados-perdidos
            - --providers.kubernetesingress.ingressclass=achados-traefik
            - --ping
            - --ping.entrypoint=web
          ports:
            - name: web
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /ping
              port: web
          resources:
            requests:
              cpu: 25m
              memory: 48Mi
---
apiVersion: v1
kind: Service
metadata:
  name: traefik
  namespace: achados-perdidos
spec:
  selector:
    app: traefik
  ports:
    - name: web
      port: 80
      targetPort: web
