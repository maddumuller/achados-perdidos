apiVersion: apps/v1
kind: Deployment
metadata:
  name: ocorrencia-service
  namespace: achados-perdidos
  labels:
    app: ocorrencia-service
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: ocorrencia-service
  template:
    metadata:
      labels:
        app: ocorrencia-service
    spec:
      enableServiceLinks: false
      containers:
        - name: ocorrencia-service
          image: ocorrencia-service:tp3
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8082
          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: OCORRENCIA_DB_URL
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: POSTGRES_PASSWORD
            - name: SPRING_DATASOURCE_DRIVER_CLASS_NAME
              value: org.postgresql.Driver
            - name: ITEM_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: OCORRENCIA_ITEM_SERVICE_URL
            - name: RABBITMQ_HOST
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: OCORRENCIA_RABBITMQ_HOST
            - name: RABBITMQ_PORT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: AUTH_RABBITMQ_PORT
            - name: RABBITMQ_USER
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: AUTH_RABBITMQ_USER
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: RABBITMQ_PASSWORD
            - name: OCORRENCIA_RESERVA_TIMEOUT_MINUTES
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: OCORRENCIA_RESERVA_TIMEOUT
            - name: JAVA_TOOL_OPTIONS
              value: '-Xms32m -Xmx144m -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -Xss512k -XX:ActiveProcessorCount=2'
            - name: MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED
              value: 'true'
            - name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
              value: '4'
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 352Mi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            timeoutSeconds: 6
            periodSeconds: 5
            failureThreshold: 72
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            timeoutSeconds: 6
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            timeoutSeconds: 6
            periodSeconds: 15
            failureThreshold: 6
