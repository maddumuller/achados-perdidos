apiVersion: v1
kind: Service
metadata:
  name: ocorrencia-service
  namespace: achados-perdidos
  labels:
    app: ocorrencia-service
spec:
  selector:
    app: ocorrencia-service
  ports:
    - port: 8082
      targetPort: 8082
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: ocorrencia-service-metrics
  namespace: achados-perdidos
spec:
  clusterIP: None
  selector:
    app: ocorrencia-service
  ports:
    - name: http
      port: 8082
      targetPort: http
