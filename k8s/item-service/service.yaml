apiVersion: v1
kind: Service
metadata:
  name: item-service
  namespace: achados-perdidos
  labels:
    app: item-service
spec:
  selector:
    app: item-service
  ports:
    - port: 8081
      targetPort: 8081
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: item-service-metrics
  namespace: achados-perdidos
spec:
  clusterIP: None
  selector:
    app: item-service
  ports:
    - name: http
      port: 8081
      targetPort: http
