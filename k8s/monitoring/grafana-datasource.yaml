apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: achados-perdidos
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: achados-prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: true
