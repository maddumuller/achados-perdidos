apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: achados-perdidos
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: Achados e Perdidos
        type: file
        options:
          path: /var/lib/grafana/dashboards
  achados.json: |
    {
      "uid": "achados-tp3",
      "title": "Achados e Perdidos",
      "schemaVersion": 39,
      "refresh": "15s",
      "panels": [
        {
          "id": 1,
          "title": "Réplicas com métricas disponíveis",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "achados-prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "expr": "sum by (job) (up{job!=\"prometheus\"})",
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "title": "Heap JVM usado por pod",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "achados-prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "expr": "sum by (job,instance) (jvm_memory_used_bytes{area=\"heap\"})",
              "refId": "A"
            }
          ]
        }
      ]
    }
