name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  test:
    name: Build & Test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - item-auth
          - item-service
          - ocorrencias

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: 'services/${{ matrix.service }}/pom.xml'

      - name: Conceder permissão de execução ao Maven Wrapper
        working-directory: services/${{ matrix.service }}
        run: chmod +x mvnw

      - name: Compilar e executar testes
        working-directory: services/${{ matrix.service }}
        run: ./mvnw clean verify

  docker-build:
    name: Validar Build dos Containers Docker
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validar Build do Docker Compose
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'ci_postgres_password' }}
        run: docker compose build
