name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  auth-service:
    name: Pipeline Auth Service
    uses: ./.github/workflows/auth-service.yml
    with:
      skip_cd: true
    secrets: inherit

  item-service:
    name: Pipeline Item Service
    uses: ./.github/workflows/item-service.yml
    with:
      skip_cd: false
    secrets: inherit

  test:
    name: Build & Test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - ocorrencia-service

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: 'services/${{ matrix.service }}/pom.xml'

      - name: Conceder permissão de execução ao Maven Wrapper
        working-directory: services/${{ matrix.service }}
        run: chmod +x mvnw

      - name: Compilar e executar testes
        working-directory: services/${{ matrix.service }}
        run: ./mvnw clean verify

  docker-build:
    name: Validar Build dos Containers Docker
    runs-on: ubuntu-latest
    needs:
      - auth-service
      - item-service
      - test
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validar Build do Docker Compose
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'ci_postgres_password' }}
        run: docker compose build
