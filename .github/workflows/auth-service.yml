name: Auth Service CI/CD

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
    paths:
      - 'services/auth-service/**'
      - '.github/workflows/auth-service.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'services/auth-service/**'
      - '.github/workflows/auth-service.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      skip_cd:
        description: 'Pular etapas de publicacao Docker e CD (usado quando chamado pelo CI geral)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  SERVICE_DIR: services/auth-service
  REGISTRY: ghcr.io

jobs:
  build-test-sonar:
    name: Build, Test & SonarCloud (auth-service)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: '${{ env.SERVICE_DIR }}/pom.xml'

      - name: Conceder permissão de execução ao Maven Wrapper
        working-directory: ${{ env.SERVICE_DIR }}
        run: chmod +x mvnw

      - name: Compilar, executar testes e gerar cobertura JaCoCo
        working-directory: ${{ env.SERVICE_DIR }}
        run: ./mvnw clean verify

      - name: Análise estática com SonarCloud
        working-directory: ${{ env.SERVICE_DIR }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::warning::Secret SONAR_TOKEN não configurado no repositório. Configure-o em Settings > Secrets and variables > Actions para enviar a análise ao SonarCloud."
            exit 0
          fi
          ORG="${SONAR_ORGANIZATION:-zacchi-devops-auth-service}"
          PROJECT_KEY="${SONAR_PROJECT_KEY:-zacchi-devops-auth-service_auth-service}"
          ./mvnw sonar:sonar \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.organization="$ORG" \
            -Dsonar.projectKey="$PROJECT_KEY" \
            -Dsonar.token="$SONAR_TOKEN"

  publish-image:
    name: Build & Push Docker Image (GHCR)
    runs-on: ubuntu-latest
    needs: build-test-sonar
    if: >-
      !inputs.skip_cd &&
      github.event_name != 'pull_request' &&
      (github.ref_name == 'develop' || github.ref_name == 'main')
    outputs:
      version: ${{ steps.pom-version.outputs.version }}
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Extrair versão SemVer do pom.xml
        id: pom-version
        working-directory: ${{ env.SERVICE_DIR }}
        run: |
          VERSION=$(grep -m1 '<version>' pom.xml | sed -E 's/.*<version>([^<]+)<\/version>.*/\1/' | tr -d '[:space:]')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Versão SemVer detectada: $VERSION"

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GitHub Container Registry (GHCR)
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Definir tags da imagem (Semantic Versioning)
        id: meta
        run: |
          IMAGE_NAME=$(echo "${{ env.REGISTRY }}/${{ github.repository_owner }}/auth-service" | tr '[:upper:]' '[:lower:]')
          VERSION="${{ steps.pom-version.outputs.version }}"
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          if [ "${{ github.ref_name }}" = "main" ]; then
            TAGS="${IMAGE_NAME}:${VERSION},${IMAGE_NAME}:homol,${IMAGE_NAME}:latest,${IMAGE_NAME}:sha-${SHORT_SHA}"
          else
            TAGS="${IMAGE_NAME}:${VERSION}-dev,${IMAGE_NAME}:dev,${IMAGE_NAME}:sha-${SHORT_SHA}"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "Tags que serão publicadas: $TAGS"

      - name: Build e Push da imagem Docker
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.SERVICE_DIR }}
          file: ${{ env.SERVICE_DIR }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}

  deploy-dev:
    name: CD — Deploy para DEV (Render)
    runs-on: ubuntu-latest
    needs: publish-image
    if: >-
      !inputs.skip_cd &&
      github.event_name != 'pull_request' &&
      github.ref_name == 'develop'
    steps:
      - name: Acionar Deploy Hook do Render (Ambiente DEV)
        env:
          RENDER_DEPLOY_HOOK_DEV: ${{ secrets.RENDER_DEPLOY_HOOK_DEV }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_DEV" ]; then
            echo "::warning::Secret RENDER_DEPLOY_HOOK_DEV não configurado. Adicione a URL do Deploy Hook do Render em Settings > Secrets and variables > Actions."
            exit 0
          fi
          echo "Disparando deploy da versão ${{ needs.publish-image.outputs.version }}-dev para o ambiente DEV no Render..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$RENDER_DEPLOY_HOOK_DEV")
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Deploy DEV acionado com sucesso no Render (HTTP $HTTP_STATUS)!"
          else
            echo "::error::Falha ao acionar Deploy Hook DEV no Render (HTTP $HTTP_STATUS)"
            exit 1
          fi

  deploy-homol:
    name: CD — Deploy para HOMOL (Render)
    runs-on: ubuntu-latest
    needs: publish-image
    if: >-
      !inputs.skip_cd &&
      github.event_name != 'pull_request' &&
      github.ref_name == 'main'
    steps:
      - name: Acionar Deploy Hook do Render (Ambiente HOMOL)
        env:
          RENDER_DEPLOY_HOOK_HOMOL: ${{ secrets.RENDER_DEPLOY_HOOK_HOMOL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_HOMOL" ]; then
            echo "::warning::Secret RENDER_DEPLOY_HOOK_HOMOL não configurado. Adicione a URL do Deploy Hook do Render em Settings > Secrets and variables > Actions."
            exit 0
          fi
          echo "Disparando deploy da versão ${{ needs.publish-image.outputs.version }} para o ambiente HOMOL no Render..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$RENDER_DEPLOY_HOOK_HOMOL")
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Deploy HOMOL acionado com sucesso no Render (HTTP $HTTP_STATUS)!"
          else
            echo "::error::Falha ao acionar Deploy Hook HOMOL no Render (HTTP $HTTP_STATUS)"
            exit 1
          fi

