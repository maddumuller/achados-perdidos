server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:h2:file:${DB_PATH:./data/authdb}
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

auth:
  jwt-secret: ${JWT_SECRET:troque-este-segredo-com-no-minimo-32-caracteres}
  jwt-expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  admin-email: ${ADMIN_EMAIL:admin@achados.local}
  admin-password: ${ADMIN_PASSWORD:Admin@1234}

management:
  endpoints:
    web:
      exposure:
        include: health
